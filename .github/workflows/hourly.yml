name: Hourly WhatsApp Motivation Trigger

on:
  schedule:
    # Runs every 1 hour (at minute 0)
    - cron: '0 * * * *'
  # Allows manual testing directly from GitHub UI (Actions tab > Run workflow)
  workflow_dispatch:

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Wake up Render (Ping)
        run: |
          RENDER_URL="${{ secrets.RENDER_URL || 'https://motivation-042y.onrender.com' }}"
          echo "Pinging Render to wake it up if asleep: $RENDER_URL/ping"
          curl -s -m 15 "$RENDER_URL/ping" || echo "Ping request completed."
          echo "Waiting 5 seconds for service to be fully ready..."
          sleep 5

      - name: 2. Trigger Free AI Motivation & WhatsApp Dispatch
        run: |
          RENDER_URL="${{ secrets.RENDER_URL || 'https://motivation-042y.onrender.com' }}"
          echo "Triggering: $RENDER_URL/send"
          RESPONSE=$(curl -s -X POST "$RENDER_URL/send")
          echo "Response: $RESPONSE"
